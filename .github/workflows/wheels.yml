name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build wheel
        env:
          VAMPIRE_WHEEL_TAG: manylinux_2_28_${{ matrix.arch }}
        run: uv build --wheel
      - name: Inspect and smoke-test wheel
        run: |
          uvx auditwheel show dist/*.whl
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python tests/test_vampire.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: dist/*.whl

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            deployment-target: "10.15"
            wheel-tag: macosx_10_15_x86_64
          - arch: arm64
            runner: macos-15
            deployment-target: "11.0"
            wheel-tag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build wheel
        env:
          VAMPIRE_WHEEL_TAG: ${{ matrix.wheel-tag }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: uv build --wheel
      - name: Smoke-test wheel
        run: |
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python tests/test_vampire.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: dist/*.whl

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - uses: cygwin/cygwin-install-action@v6
        id: cygwin
        with:
          packages: gcc-g++,make,cmake,python3
      - name: Fetch Vampire
        run: git clone --depth=1 --branch=v5.1.0 --recurse-submodules --shallow-submodules https://github.com/vprover/vampire.git build/vampire-source
      - name: Build Vampire
        shell: bash -o igncr -eo pipefail {0}
        run: |
          cmake -S build/vampire-source/z3 -B build/vampire-source/z3/build -DCMAKE_BUILD_TYPE=Release -DZ3_BUILD_EXECUTABLE=OFF -DZ3_BUILD_TEST_EXECUTABLES=OFF -DZ3_BUILD_LIBZ3_SHARED=OFF
          cmake --build build/vampire-source/z3/build --parallel 4
          cmake -S build/vampire-source -B build/vampire-source/build -DCMAKE_BUILD_TYPE=Release -DCCACHE_PROGRAM=OFF
          cmake --build build/vampire-source/build --target vampire --parallel 4
          strip build/vampire-source/build/vampire.exe
      - name: Build wheel
        env:
          VAMPIRE_BINARY: ${{ github.workspace }}\build\vampire-source\build\vampire.exe
          VAMPIRE_WHEEL_TAG: win_amd64
        run: |
          Copy-Item '${{ steps.cygwin.outputs.root }}/bin/cygwin1.dll' build/vampire-source/build/
          uv build --wheel
      - name: Smoke-test wheel without Cygwin on PATH
        env:
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "$env:CYGWIN_ROOT*" }) -join ';'
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke/Scripts/python.exe (Get-ChildItem dist/*.whl).FullName
          .smoke/Scripts/python.exe tests/test_vampire.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kdrag-vampire
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: uv publish dist/*.whl
